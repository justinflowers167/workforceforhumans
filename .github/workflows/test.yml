# Phase 11 §B (2026-04-28) — runs Deno unit tests on every push and PR.
# Phase 14 §B (2026-05-09) — coverage gate added: aggregate line coverage
# across all 7 callable Edge Functions must stay >= 70%. PRs that drop
# below the threshold fail CI.
#
# Tests use mocked fetch + env (see supabase/functions/_test/mocks.ts);
# no live API calls, no Supabase project access from CI.
name: test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  deno-test:
    name: Deno tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Cache Deno dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/deno
          key: deno-${{ runner.os }}-${{ hashFiles('deno.json') }}
          restore-keys: |
            deno-${{ runner.os }}-

      # --no-check matches Supabase Edge Function deploy behavior (the
      # runtime evaluates JS without typechecking). The Anthropic SDK pin
      # (0.32.1) doesn't yet include `cache_control` in its TextBlockParam
      # type — the field is a valid API parameter that the SDK forwards
      # transparently, so production runs fine, but `deno test`'s default
      # typecheck rejects it. Bumping the SDK across 4 functions is a
      # bigger move than this fix warrants; revisit when we need a newer
      # SDK feature.
      - name: Run tests
        run: deno task test

      - name: Coverage gate (>= 70%)
        if: success()
        run: |
          deno test --no-check --allow-net --allow-env --allow-read --coverage=cov supabase/functions/
          deno coverage cov --lcov > cov.lcov
          # Aggregate line coverage across all .ts files reported by lcov.
          # `DA:<line>,<hits>` is one record per executable line. Lines
          # are "hit" if hits > 0. Fail if hit/total < 0.70.
          LINES=$(grep -c "^DA:" cov.lcov || echo 0)
          HIT=$(grep -c "^DA:.*,[1-9]" cov.lcov || echo 0)
          if [ "$LINES" -eq 0 ]; then
            echo "ERROR: no coverage data emitted"
            exit 1
          fi
          PCT=$(awk -v h="$HIT" -v l="$LINES" 'BEGIN { printf "%.1f", (h / l) * 100 }')
          echo "Coverage: ${PCT}% (${HIT}/${LINES} lines)"
          awk -v h="$HIT" -v l="$LINES" 'BEGIN { exit !(h / l >= 0.70) }' || {
            echo "FAIL: coverage ${PCT}% < 70% threshold"
            exit 1
          }
          echo "PASS: coverage >= 70%"
